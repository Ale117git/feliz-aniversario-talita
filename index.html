<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AmorOS 98 — Feliz Aniversário</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Caveat:wght@600&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cinza:#c0c0c0; --cinza-esc:#808080; --branco:#fff; --preto:#000;
    --azul:#000080; --azul2:#1084d0; --fundo:#008080;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  :root{color-scheme:light only}
  body{font-family:'Pixelify Sans',Tahoma,Verdana,sans-serif;font-size:15px;background:#000;color:#000;user-select:none}
  .janela,.janela *{color:#000}
  .janela .titulo,.janela .titulo *{color:#fff}
  .janela .bt{color:#000!important}
  button{color:#000}

  /* ===== trancado / desbloqueio ===== */
  .icone.trancado .img{filter:grayscale(1) brightness(.7) drop-shadow(2px 2px 0 rgba(0,0,0,.4))}
  .icone.trancado .img::before{content:'🔒';position:absolute;font-size:18px;margin:22px 0 0 22px;filter:none}
  .icone.trancado span{opacity:.75}
  .icone.desbloqueou{animation:brilho 1s 3}
  @keyframes brilho{50%{transform:scale(1.2);filter:drop-shadow(0 0 10px #ffdd00)}}
  #menuIniciar li.tr{opacity:.5}

  /* ===== jogos ===== */
  .placar{display:flex;justify-content:space-between;font-family:'VT323';font-size:20px;padding:4px 6px;margin-bottom:6px}
  .placar *{color:#00ff66!important}
  .memoria{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(300px,calc(100vw - 50px))}
  .carta-m{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
  .carta-m .f{display:none}
  .carta-m .v{font-family:'VT323';font-size:26px;color:#000080!important}
  .carta-m.virada,.carta-m.certa{background:#fff;border-color:var(--cinza-esc) var(--branco) var(--branco) var(--cinza-esc)}
  .carta-m.virada .f,.carta-m.certa .f{display:block}
  .carta-m.virada .v,.carta-m.certa .v{display:none}
  .carta-m.certa{background:#ffe0f2}
  .puzzle{position:relative;width:min(270px,calc(100vw - 60px));aspect-ratio:1;background:#000}
  .peca{position:absolute;width:33.333%;height:33.333%;background-size:300% 300%;transition:left .15s,top .15s;cursor:pointer;
    box-shadow:inset 1px 1px 0 rgba(255,255,255,.5),inset -1px -1px 0 rgba(0,0,0,.5)}
  .ref{width:64px;height:64px;background-size:cover;border:1px solid #888}
  #jogoCanvas{display:block;background:#1a0033;touch-action:none;width:min(300px,calc(100vw - 50px));aspect-ratio:3/4}

  /* ======= BOOT ======= */
  #boot{position:fixed;inset:0;background:#000;color:#c0c0c0;font-family:'VT323',monospace;font-size:20px;
    padding:20px;z-index:999;line-height:1.3;white-space:pre-wrap}
  #boot .ok{color:#55ff55}
  #boot .rosa{color:#ff77c8}
  #boot.sumir{animation:sumir .5s forwards}
  @keyframes sumir{to{opacity:0;visibility:hidden}}

  /* ======= DESKTOP ======= */
  #desktop{position:fixed;inset:0 0 40px 0;
    background:var(--fundo);
    background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:4px 4px}
  #wall{position:absolute;right:20px;bottom:20px;font-family:'VT323';font-size:40px;color:rgba(255,255,255,.18);text-align:right;line-height:.9;pointer-events:none}
  .icones{position:absolute;top:10px;left:10px;display:grid;grid-template-columns:repeat(auto-fill,84px);
    grid-auto-rows:88px;gap:4px;width:calc(100% - 20px)}
  .icone{display:flex;flex-direction:column;align-items:center;cursor:pointer;padding:4px;text-align:center}
  .icone .img{font-size:36px;line-height:44px;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.4))}
  .icone span{color:#fff;font-size:12px;word-break:break-word;max-width:80px;line-height:1.15;margin-top:2px;padding:1px 3px;text-shadow:1px 1px 0 #000}
  .icone.sel span{background:var(--azul);outline:1px dotted #fff}
  .icone.novo .img::after{content:'NOVO';position:absolute;font-size:9px;background:red;color:#fff;padding:0 3px;margin-left:-8px;font-family:'VT323'}

  #wallDino{position:absolute;left:14px;bottom:10px;font-size:64px;opacity:.9;transform:scaleX(-1);animation:dinoAnda 3s ease-in-out infinite;pointer-events:none}
  @keyframes dinoAnda{50%{transform:scaleX(-1) translateY(-6px) rotate(-4deg)}}
  /* ======= JANELA (bevel 3D) ======= */
  .bevel{background:var(--cinza);border:2px solid;border-color:var(--branco) var(--preto) var(--preto) var(--branco);
    box-shadow:inset -1px -1px 0 var(--cinza-esc),inset 1px 1px 0 #dfdfdf}
  .afundado{border:2px solid;border-color:var(--cinza-esc) var(--branco) var(--branco) var(--cinza-esc);background:#fff}
  .janela{position:absolute;min-width:260px;max-width:calc(100vw - 16px);padding:3px;display:none;flex-direction:column}
  .janela.aberta{display:flex;animation:abrir .15s}
  @keyframes abrir{from{transform:scale(.6);opacity:0}}
  .titulo{background:linear-gradient(90deg,var(--azul),var(--azul2));color:#fff;padding:3px 4px 3px 6px;
    display:flex;align-items:center;gap:6px;cursor:move;touch-action:none;font-weight:600;font-size:14px}
  .janela.inativa .titulo{background:linear-gradient(90deg,#808080,#b5b5b5)}
  .titulo .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bt{width:22px;height:20px;font:700 13px/14px 'Pixelify Sans',sans-serif;cursor:pointer;color:#000;padding:0;display:flex;align-items:center;justify-content:center}
  .bt:active,.botao:active{border-color:var(--preto) var(--branco) var(--branco) var(--preto)}
  .menu-jan{display:flex;gap:14px;padding:3px 6px;font-size:13px}
  .menu-jan u{text-decoration:underline}
  .corpo{padding:10px;overflow:auto;max-height:calc(100vh - 140px)}
  .botao{padding:6px 18px;font:15px 'Pixelify Sans',sans-serif;cursor:pointer;color:#000;min-width:80px}
  .botao:focus{outline:1px dotted #000;outline-offset:-5px}
  .linha-botoes{display:flex;justify-content:center;gap:8px;margin-top:12px}
  .status{border-top:1px solid var(--cinza-esc);margin-top:6px;padding:3px 6px;font-size:12px;display:flex;gap:6px}
  .status div{flex:1;padding:1px 4px}

  /* barra de progresso */
  .progresso{height:22px;padding:2px;display:flex;gap:2px;overflow:hidden}
  .progresso i{width:12px;flex:none;background:var(--azul)}

  /* ======= TASKBAR ======= */
  #taskbar{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:4px;padding:3px;z-index:500}
  #btnIniciar{display:flex;align-items:center;gap:5px;font-weight:600;padding:3px 8px;height:32px;cursor:pointer;font-family:'Pixelify Sans'}
  #tarefas{flex:1;display:flex;gap:3px;overflow-x:auto}
  .tarefa{height:30px;padding:0 8px;font-size:12px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;max-width:130px;overflow:hidden}
  .tarefa.ativa{border-color:var(--preto) var(--branco) var(--branco) var(--preto);background:#e0e0e0}
  #relogio{height:30px;padding:0 10px;display:flex;align-items:center;font-size:13px;gap:6px}
  #relogio{border:1px solid;border-color:var(--cinza-esc) var(--branco) var(--branco) var(--cinza-esc)}

  #menuIniciar{position:fixed;left:3px;bottom:40px;width:230px;z-index:600;display:none}
  #menuIniciar.aberto{display:flex}
  #menuIniciar .lateral{width:30px;background:linear-gradient(0deg,var(--azul),var(--azul2));color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);
    font-weight:600;font-size:18px;padding:8px 4px;text-align:right}
  #menuIniciar .lateral b{color:#ff9ad5}
  #menuIniciar ul{list-style:none;flex:1;padding:2px}
  #menuIniciar li{padding:8px 10px;display:flex;gap:10px;align-items:center;cursor:pointer}
  #menuIniciar li:hover,#menuIniciar li:active{background:var(--azul);color:#fff}
  #menuIniciar hr{border:none;border-top:1px solid var(--cinza-esc);border-bottom:1px solid #fff;margin:2px}

  /* ======= CONTEÚDOS ======= */
  .msg{display:flex;gap:14px;align-items:flex-start;padding:6px 4px;max-width:320px}
  .msg .ic{font-size:34px}

  /* bolo pixel */
  .cena-bolo{background:#1a0033;padding:18px 10px 10px;display:flex;flex-direction:column;align-items:center;min-width:250px}
  .px-bolo{position:relative;width:180px;height:140px}
  .px-bolo .andar{position:absolute;left:50%;transform:translateX(-50%);image-rendering:pixelated}
  .a1{bottom:0;width:180px;height:56px;background:#ff77c8;box-shadow:inset 0 -8px 0 #d94fa3,inset 0 10px 0 #fff}
  .a2{bottom:56px;width:132px;height:44px;background:#ffd1ec;box-shadow:inset 0 -6px 0 #ffa8d8,inset 0 8px 0 #fff}
  .px-velas{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);display:flex;gap:24px}
  .pv{width:8px;height:30px;background:repeating-linear-gradient(#fff 0 6px,#6cf 6px 12px);position:relative;cursor:pointer}
  .pv::before{content:'';position:absolute;top:-16px;left:-2px;width:12px;height:14px;
    background:#ffdd00;box-shadow:inset 3px 3px 0 #fff59d,inset -3px -2px 0 #ff8800;animation:pisca .25s steps(2) infinite}
  .pv.off::before{display:none}
  .pv.off::after{content:'~';position:absolute;top:-22px;left:-1px;color:#aaa;font-family:VT323;font-size:20px}
  @keyframes pisca{50%{transform:translateY(-2px) scaleX(.8)}}
  .placa{font-family:'VT323';color:#ff77c8;font-size:24px;margin-top:10px;text-align:center;min-height:50px}

  /* fotos */
  .pasta{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:8px;min-height:180px;width:min(440px,calc(100vw - 50px))}
  .arq{display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center;font-size:12px}
  .thumb{width:80px;height:80px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#eee;overflow:hidden;border:1px solid #888}
  .thumb img{width:100%;height:100%;object-fit:cover;image-rendering:auto}
  .arq small{color:#666}
  .visor{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(400px,calc(100vw - 50px))}
  .visor .grande{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:80px;background:#222;overflow:hidden}
  .visor .grande img{width:100%;height:100%;object-fit:contain}
  .visor p{font-size:14px;text-align:center}

  /* bloco de notas */
  .notas{font-family:'VT323',monospace;font-size:21px;padding:8px;color:#000!important;background:#fff!important;width:min(420px,calc(100vw - 50px));min-height:240px;
    white-space:pre-wrap;line-height:1.15;user-select:text}
  .cursor{display:inline-block;width:9px;height:18px;background:#000;vertical-align:-3px;animation:cur 1s steps(1) infinite}
  @keyframes cur{50%{opacity:0}}

  /* polaroids empilhadas */
  .mesa{background:#7a4b2a;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 3px,transparent 3px 22px);
    padding:24px 18px 14px;width:min(320px,calc(100vw - 50px))}
  .pilha{position:relative;width:100%;aspect-ratio:.86}
  .polaroid{position:absolute;inset:0;background:#fffdf8;padding:10px 10px 52px;box-shadow:0 6px 14px rgba(0,0,0,.45);
    touch-action:none;cursor:grab;transition:transform .35s ease}
  .polaroid.arrastando{transition:none;cursor:grabbing}
  .polaroid img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;background:#222;-webkit-user-drag:none}
  .polaroid .leg{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:'Caveat',cursive;font-size:25px;color:#333!important}
  .dica-pilha{text-align:center;font-size:13px;color:#fff!important;margin-top:20px;animation:pulsa 1.6s infinite}
  @keyframes pulsa{50%{opacity:.4}}
  .giro{position:relative;width:min(270px,calc(100vw - 60px));aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#000;padding:2px}
  .giro div{background-size:300% 300%;cursor:pointer;transition:transform .25s}
  .giro.feito{gap:0}
  .giro.feito div{transition:none}
  .final-pol{background:#fffdf8;padding:10px 10px 58px;box-shadow:0 6px 14px rgba(0,0,0,.35);transform:rotate(-3deg);margin:14px auto;position:relative;max-width:280px}
  .final-pol img{width:100%;display:block}
  .final-pol .leg{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:'Caveat';font-size:26px;color:#c2007a!important}
  /* quiz */
  .quiz{width:min(330px,calc(100vw - 50px));position:relative;min-height:330px}
  .quiz .perg{font-size:17px;font-weight:600;margin:10px 0 12px;min-height:44px}
  .quiz .op{display:block;width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;font:15px 'Pixelify Sans',sans-serif;cursor:pointer}
  .quiz .op.certa{background:#b6f5b6}
  .quiz .op.errada{background:#f5b6b6}
  .quiz .fb{min-height:22px;font-size:14px;text-align:center;margin-top:4px}
  .quiz .fujao{position:absolute;transition:left .15s,top .15s;width:auto!important}
  /* cupom */
  .cupom{border:3px dashed #ff3ea5;background:#fff0fa;padding:16px;text-align:center;margin-top:10px;font-family:'VT323';font-size:22px}
  .cupom h3{font-family:'Pixelify Sans';color:#c2007a;font-size:20px;margin-bottom:6px}

  /* efeitos */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:800}
  .cora{position:fixed;pointer-events:none;z-index:801;font-size:22px;animation:sobe linear forwards}
  @keyframes sobe{to{transform:translateY(-110vh);opacity:.3}}
  .tremer{animation:tremor .4s}
  @keyframes tremor{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,0)}}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot"></div>

<!-- DESKTOP -->
<div id="desktop">
  <div id="wallDino">🦕</div>
  <div id="wall">Feliz<br>Aniversário<br><span id="wallNome"></span></div>
  <div class="icones" id="icones"></div>
</div>

<!-- MENU INICIAR -->
<div id="menuIniciar" class="bevel">
  <div class="lateral">Amor<b>OS</b> 98</div>
  <ul>
    <li data-abrir="bolo">🎂 Bolo.exe</li>
    <li data-abrir="memoria">🃏 Memoria.exe</li>
    <li data-abrir="fotos">📁 Nossas Fotos</li>
    <li data-abrir="motivos">📝 Motivos.txt</li>
    <li data-abrir="quebra">🧩 QuebraCabeca.exe</li>
    <li data-abrir="carta">💌 Carta.doc</li>
    <li data-abrir="quiz">❓ Quiz.exe</li>
    <li data-abrir="pega">💘 PegaCoracao.exe</li>
    <li data-abrir="surpresa">🎁 Surpresa.zip</li>
    <li data-abrir="dino">🦖 Dino.exe</li>
    <hr>
    <li data-abrir="dev">🛠️ Modo Desenvolvedor</li>
    <li data-abrir="desligar">⏻ Desligar...</li>
  </ul>
</div>

<!-- TASKBAR -->
<div id="taskbar" class="bevel">
  <button id="btnIniciar" class="bevel">💖 Iniciar</button>
  <div id="tarefas"></div>
  <div id="relogio">🔊 <span id="hora">00:00</span></div>
</div>

<canvas id="fx"></canvas>
<input type="file" id="inputFoto" accept="image/*" hidden>

let zTopo=10;const janelas={};
function criarJanela(id,titulo,icone,html,opts={}){
  if(janelas[id])return janelas[id];
  const j=document.createElement('div');j.className='janela bevel';j.dataset.id=id;
  j.innerHTML=`<div class="titulo"><span>${icone}</span><span class="t">${titulo}</span>
    ${opts.semMin?'':'<button class="bt bevel" data-a="min">_</button>'}<button class="bt bevel" data-a="fechar">✕</button></div>
    ${opts.menu?`<div class="menu-jan"><span><u>A</u>rquivo</span><span><u>E</u>ditar</span><span><u>A</u>juda</span></div>`:''}
    <div class="corpo">${html}</div>`;
  document.body.appendChild(j);
  j.addEventListener('pointerdown',()=>focar(j));
  j.querySelector('[data-a=fechar]').addEventListener('click',e=>{e.stopPropagation();fechar(id)});
  const mn=j.querySelector('[data-a=min]');if(mn)mn.addEventListener('click',e=>{e.stopPropagation();j.classList.remove('aberta');atualizarTarefas()});
  arrastar(j,j.querySelector('.titulo'));
  janelas[id]={el:j,titulo,icone,opts};
  return janelas[id];
}
function posicionar(j){
  j.style.left='0px';j.style.top='0px';
  const w=j.offsetWidth,h=j.offsetHeight,W=innerWidth,H=innerHeight-40;
  const off=(Object.values(janelas).filter(x=>x.el.classList.contains('aberta')).length%4)*14;
  j.style.left=Math.max(4,(W-w)/2+off-20)+'px';
  j.style.top=Math.max(4,Math.min((H-h)/2+off-20,H-h-4))+'px';
}
function mostrar(id){
  const J=janelas[id];const j=J.el;const jaAberta=j.classList.contains('aberta');
  j.classList.add('aberta');if(!jaAberta)posicionar(j);focar(j);atualizarTarefas();somAbrir();
  if(J.aoAbrir)J.aoAbrir();
}
function fechar(id){const J=janelas[id];if(!J)return;J.el.classList.remove('aberta');if(J.aoFechar)J.aoFechar();atualizarTarefas()}
function focar(j){j.style.zIndex=++zTopo;document.querySelectorAll('.janela').forEach(x=>x.classList.toggle('inativa',x!==j));atualizarTarefas()}
function arrastar(j,barra){
  let sx,sy,ox,oy,ativo=false;
  barra.addEventListener('pointerdown',e=>{if(e.target.closest('.bt'))return;ativo=true;sx=e.clientX;sy=e.clientY;ox=j.offsetLeft;oy=j.offsetTop;barra.setPointerCapture(e.pointerId)});
  barra.addEventListener('pointermove',e=>{if(!ativo)return;
    j.style.left=Math.min(innerWidth-60,Math.max(-j.offsetWidth+60,ox+e.clientX-sx))+'px';
    j.style.top=Math.min(innerHeight-70,Math.max(0,oy+e.clientY-sy))+'px'});
  barra.addEventListener('pointerup',()=>ativo=false);
}
function atualizarTarefas(){
  const t=$('#tarefas');t.innerHTML='';
  Object.entries(janelas).forEach(([id,J])=>{
    if(J.opts.semTarefa)return;
    const aberta=J.el.classList.contains('aberta');
    if(!aberta&&!J.minimizavel)return;
    const b=document.createElement('button');
    const ativa=aberta&&!J.el.classList.contains('inativa');
    b.className='tarefa bevel'+(ativa?' ativa':'');b.textContent=J.icone+' '+J.titulo;
    b.onclick=()=>{if(ativa){J.el.classList.remove('aberta');atualizarTarefas()}else mostrar(id)};
    t.appendChild(b);
  });
}

            if(ang.every(a=>a%360===0)){fim=true;
              setTimeout(()=>{g.classList.add('feito');g.querySelectorAll('div').forEach(x=>x.style.transform='none');confete();coracoes(15);
                setTimeout(()=>caixa('qbOk','🧩','QuebraCabeca.exe',`Montado com <b>${giros}</b> giros!<br><br>Igual a gente: as peças se encaixam perfeitamente 💕`,
                  [['OK',()=>{fechar('qbOk');desbloquear('carta')}]]),900);},300);}
          };
          g.appendChild(d);
        }
      });
    }
    mostrar('quebra');
  },

  pega(){
    const J=criarJanela('pega','PegaCoracao.exe','💘',
      `<div class="placar afundado" style="background:#000"><span id="pgPts">Pontos: 0/15</span><span>Evite 💔</span></div>
       <canvas id="jogoCanvas" width="300" height="400" class="afundado"></canvas>
       <div class="linha-botoes"><button class="botao bevel" id="pgBtn">▶ Jogar</button></div>`);
    J.minimizavel=true;
    if(!J.pronto){J.pronto=true;
      const cv=J.el.querySelector('#jogoCanvas'),x=cv.getContext('2d'),W=300,H=400,btn=J.el.querySelector('#pgBtn');
      let cx=W/2,itens=[],pts=0,rodando=false,ultimo=0,venceu=false;
      const tela=msg=>{x.fillStyle='#1a0033';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='24px VT323, monospace';x.textAlign='center';x.textBaseline='middle';
        msg.split('\n').forEach((l,i,a)=>x.fillText(l,W/2,H/2+(i-(a.length-1)/2)*28))};
      tela('Arraste a cestinha 🧺\npra pegar 15 corações!\n\nCuidado com o 💔');
      const mover=e=>{const r=cv.getBoundingClientRect();cx=Math.max(22,Math.min(W-22,(e.clientX-r.left)/r.width*W))};
      cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);mover(e)});
      cv.addEventListener('pointermove',mover);
      const atual=()=>J.el.querySelector('#pgPts').textContent=`Pontos: ${pts}/15`;
      btn.onclick=()=>{if(rodando)return;pts=0;itens=[];rodando=true;btn.textContent='Jogando...';atual();requestAnimationFrame(loop)};
      function loop(t){
        if(!rodando)return;
        if(t-ultimo>700-Math.min(pts*18,320)){ultimo=t;const ruim=Math.random()<.25;
          itens.push({x:22+Math.random()*(W-44),y:-20,v:2.2+Math.random()*1.5+pts*.09,e:ruim?'💔':['💖','💕','💗','💘'][Math.floor(Math.random()*4)],ruim});}
        x.fillStyle='#1a0033';x.fillRect(0,0,W,H);
        x.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<30;i++)x.fillRect((i*97)%W,(i*53+t/40)%H,2,2);
        x.textAlign='center';x.textBaseline='middle';x.font='28px serif';
        itens.forEach(it=>{it.y+=it.v;x.fillText(it.e,it.x,it.y)});
        x.font='42px serif';x.fillText('🧺',cx,H-30);
        itens=itens.filter(it=>{
          if(it.y>H-58&&it.y<H-12&&Math.abs(it.x-cx)<34){
            if(it.ruim){pts=Math.max(0,pts-2);somErro();cv.classList.add('tremer');setTimeout(()=>cv.classList.remove('tremer'),400)}
            else{pts++;bip(900+pts*30,.06)}
            atual();return false}
          return it.y<H+20});
        if(pts>=15){rodando=false;btn.textContent='▶ Jogar de novo';
          tela('VOCÊ VENCEU! 💖\n\nMeu coração já era seu,\nagora é oficial.');confete();coracoes(20);
          if(!venceu){venceu=true;setTimeout(()=>desbloquear('surpresa'),1500)}return}
        requestAnimationFrame(loop);
      }
      J.aoFechar=()=>{if(rodando){rodando=false;btn.textContent='▶ Jogar';tela('Jogo pausado.\nToque em Jogar.')}};
    }
    mostrar('pega');
  },

  quiz(){
    const J=criarJanela('quiz','Quiz.exe — Prova do Amor','❓',`<div class="placar afundado" style="background:#000"><span id="qzN">Questão 1</span><span id="qzP">Acertos: 0</span></div><div class="quiz" id="qz"></div>`);
    J.minimizavel=true;
    if(!J.pronto){J.pronto=true;
      const box=J.el.querySelector('#qz'),total=CONFIG.quiz.length+1;let q=0,acertos=0;
      const placar=()=>{J.el.querySelector('#qzN').textContent=`Questão ${Math.min(q+1,total)}/${total}`;J.el.querySelector('#qzP').textContent=`Acertos: ${acertos}`};
      function mostra(){
        placar();
        if(q<CONFIG.quiz.length){
          const Q=CONFIG.quiz[q];let errou=false,feito=false;
          box.innerHTML=`<div class="perg">${Q.p}</div>`+Q.o.map((o,i)=>`<button class="op bevel" data-i="${i}">${'ABCD'[i]}) ${o}</button>`).join('')+`<div class="fb" id="fb"></div>`;
          box.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
            if(feito)return;const i=+b.dataset.i,fb=box.querySelector('#fb');
            if(i===Q.c){feito=true;b.classList.add('certa');if(!errou)acertos++;placar();
              [880,1175].forEach((f,k)=>bip(f,.1,'square',.07,k*.1));fb.textContent=errou?'✔ Agora sim! 😄':'✔ Acertou! 💖';
              setTimeout(()=>{q++;mostra()},1100);}
            else{errou=true;b.classList.add('errada');b.disabled=true;somErro();fb.textContent='✖ '+(Q.erro[i]||'Errou! Tenta de novo kk');
              J.el.classList.add('tremer');setTimeout(()=>J.el.classList.remove('tremer'),400);}
          });
        }else if(q===CONFIG.quiz.length){
          box.innerHTML=`<div class="perg">Última pergunta (e a mais importante):<br><br>Você quer continuar sendo minha namorada? 💍</div>
            <button class="op bevel" data-s>A) Sim 💖</button><button class="op bevel" data-s>B) Claro que sim 🥰</button>
            <button class="op bevel fujao" id="nao" style="left:0;top:220px">C) Não</button><div class="fb" id="fb" style="margin-top:60px"></div>`;
          const nao=box.querySelector('#nao'),fb=box.querySelector('#fb');let fugas=0;
          const frases=['Opa, esse botão tá com defeito kk','Ih, fugiu 😂','Desiste, ele não deixa kk','Erro 404: "Não" não encontrado','Essa opção foi desativada pelo administrador 💖'];
          const foge=e=>{if(e){e.preventDefault();e.stopPropagation()}
            const W=box.clientWidth-nao.offsetWidth,H=box.clientHeight-nao.offsetHeight;
            nao.style.left=Math.random()*W+'px';nao.style.top=(200+Math.random()*Math.max(0,H-200))+'px';
            bip(300+Math.random()*400,.05);fb.textContent=frases[Math.min(fugas++,frases.length-1)];};
          nao.addEventListener('pointerenter',foge);nao.addEventListener('pointerdown',foge);nao.addEventListener('click',foge);
          box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{b.classList.add('certa');acertos++;q++;nao.remove();parabensCurto();coracoes(30);confete();setTimeout(mostra,1300)});
        }else{
          const nota=Math.round(acertos/total*10);
          box.innerHTML=`<div class="perg" style="text-align:center">📋 RESULTADO</div>
            <p style="text-align:center;font-family:VT323;font-size:26px;line-height:1.2">Acertos de primeira: ${acertos}/${total}<br>Nota: ${nota}/10<br><br>${nota>=8?'APROVADA COM LOUVOR 💯':'APROVADA (porque eu te amo kk) 💖'}</p>
            <div class="linha-botoes"><button class="botao bevel" id="qzOk">Continuar ➜</button></div>`;
          box.querySelector('#qzOk').onclick=()=>{fechar('quiz');desbloquear('pega')};
        }
      }
      mostra();
    }
    mostrar('quiz');
  },

  dino(){
    const J=criarJanela('dino','Dino.exe','🦖',
      `<div class="placar afundado" style="background:#000"><span id="dnP">💖 0</span><span id="dnR">Recorde: 0</span></div>
       <canvas id="dinoCv" width="320" height="180" class="afundado" style="display:block;width:min(320px,calc(100vw - 50px));background:#fff7e6;touch-action:none"></canvas>
       <p style="font-size:13px;text-align:center;margin-top:6px">Toque na tela pra pular 🦖 · pegue 💖 · desvie dos 🌵</p>`);
    J.minimizavel=true;
    if(!J.pronto){J.pronto=true;
      const cv=J.el.querySelector('#dinoCv'),x=cv.getContext('2d'),W=320,H=180,CH=140;
      let dy=0,vy=0,obs=[],t=0,vel=4,pts=0,rec=0,rod=false,morto=false,falou=false;
      const txt=(m,yy=H/2)=>{x.fillStyle='#4a2c3a';x.font='20px VT323, monospace';x.textAlign='center';m.split('\n').forEach((l,i)=>x.fillText(l,W/2,yy+i*22))};
      function cena(){x.fillStyle='#fff7e6';x.fillRect(0,0,W,H);x.fillStyle='#c9a77c';x.fillRect(0,CH+2,W,2);
        for(let i=0;i<8;i++)x.fillRect(((i*53-t*vel*.5)%W+W)%W,CH+8+(i%3)*6,6,2);}
      function desenhaDino(){x.save();x.translate(40,CH-dy);x.scale(-1,1);x.font='38px serif';x.textAlign='center';x.textBaseline='bottom';x.fillText('🦖',0,4);x.restore();}
      cena();desenhaDino();txt('Toque pra começar!\nRAWR 🦖',70);
      function pula(){if(!rod){comecar();return}if(dy===0){vy=8.5;bip(660,.05,'square',.05)}}
      cv.addEventListener('pointerdown',e=>{e.preventDefault();pula()});
      function comecar(){obs=[];t=0;vel=4;pts=0;dy=0;vy=0;rod=true;morto=false;J.el.querySelector('#dnP').textContent='💖 0';requestAnimationFrame(loop)}
      function loop(){
        if(!rod)return;t++;vel=4+t/600;
        vy-=.5;dy=Math.max(0,dy+vy);if(dy===0)vy=0;
        if(t%Math.max(45,95-Math.floor(t/120))===0||(obs.length===0&&t>30)){
          const cora=Math.random()<.35;obs.push({x:W+10,y:cora?(Math.random()<.5?40:70):0,cora});}
        cena();
        x.textAlign='center';x.textBaseline='bottom';
        obs.forEach(o=>{o.x-=vel;x.font=o.cora?'22px serif':'30px serif';x.fillText(o.cora?'💖':'🌵',o.x,CH+2-o.y)});
        desenhaDino();
        obs=obs.filter(o=>{
          const perto=Math.abs(o.x-40)<20;
          if(o.cora&&perto&&Math.abs((CH-o.y)-(CH-dy-18))<28){pts++;bip(1000+pts*20,.06);J.el.querySelector('#dnP').textContent='💖 '+pts;
            if(pts===10&&!falou){falou=true;coracoes(15)}return false}
          if(!o.cora&&Math.abs(o.x-40)<16&&dy<22){morto=true}
          return o.x>-20});
        if(pts>=10){x.font='16px VT323, monospace';x.fillStyle='#c2007a';x.textAlign='center';x.fillText('RAWR = "te amo" em dinossauro 🦖💖',W/2,22)}
        if(morto){rod=false;somErro();if(pts>rec){rec=pts;J.el.querySelector('#dnR').textContent='Recorde: '+rec}
          txt(pts>=10?'Fim! '+pts+' corações 💖\nTal dino, tal Talita kk\nToque pra jogar de novo':'Ops, o cacto! 🌵\n'+pts+' corações\nToque pra jogar de novo',60);return}
        requestAnimationFrame(loop);
      }
      J.aoFechar=()=>{if(rod){rod=false;cena();desenhaDino();txt('Pausado. Toque pra recomeçar',90)}};
    }
    mostrar('dino');
  },

function imagemQuadrada(src,cb){
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=450;
    const l=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-l)/2,(im.height-l)/2,l,l,0,0,450,450);
    try{cb(c.toDataURL('image/jpeg',.85))}catch(e){cb(src)}};
  im.onerror=()=>cb(imagemPuzzle());im.src=src;
}
function parabensCurto(){[523,659,784,1046,784,1046].forEach((f,i)=>bip(f,.18,"square",.07,i*.13))}
/* modo desenvolvedor (só para teste): senha "ale" desbloqueia tudo */
function tentarDev(){
  const inp=document.getElementById('devSenha');if(!inp)return;
  if(inp.value.trim().toLowerCase()==='ale'){
    fechar('dev');
    ICONES.forEach(ic=>{liberado[ic.id]=true;iconeEl[ic.id].classList.remove('trancado')});
    atualizarMenu();
    [523,659,784,1046].forEach((f,i)=>bip(f,.1,'square',.07,i*.08));
    caixa('devOk','🛠️','Modo Desenvolvedor','✔ Modo desenvolvedor ativado!<br><br>Todos os programas foram desbloqueados.');
  }else{
    somErro();inp.value='';document.getElementById('devErro').textContent='Senha incorreta.';
    const j=janelas.dev.el;j.classList.add('tremer');setTimeout(()=>j.classList.remove('tremer'),400);
  }
}
/* imagem do quebra-cabeça: usa a 1ª foto se houver, senão gera um coração pixelado */
function imagemPuzzle(){
  const f=CONFIG.fotos.find(f=>f.src);if(f)return f.src;
  const t=document.querySelector('.thumb img');if(t)return t.src;
  const c=document.createElement('canvas');c.width=c.height=300;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,300,300);g.addColorStop(0,'#ff77c8');g.addColorStop(.5,'#b26bff');g.addColorStop(1,'#00b7ff');
  x.fillStyle=g;x.fillRect(0,0,300,300);
  x.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<40;i++)x.fillRect((i*67)%300,(i*41)%300,6,6);
  const h=["01100110","11111111","11111111","11111111","01111110","00111100","00011000"];
  h.forEach((r,i)=>[...r].forEach((b,j)=>{if(b==='1'){x.fillStyle='#000';x.fillRect(70+j*20,40+i*20,20,20);x.fillStyle=(i<2&&j<3)?'#fff':'#ff1f8f';x.fillRect(72+j*20,42+i*20,16,16)}}));
  x.fillStyle='#fff';x.textAlign='center';x.font='bold 34px monospace';x.fillText('TE AMO',150,230);
  x.font='24px monospace';x.fillText(CONFIG.nome,150,268);
  return c.toDataURL();
}

/* ---------- EFEITOS: confete pixelado + corações ---------- */
const cv=$('#fx'),ctx=cv.getContext('2d');let pecas=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function confete(){
  const cores=['#ff3ea5','#ffdd00','#00e5ff','#7cff4f','#ffffff','#b26bff'];
  const vazio=!pecas.length;
  for(let i=0;i<160;i++)pecas.push({x:cv.width/2,y:cv.height/2.5,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,s:[4,6,8][i%3],c:cores[i%cores.length],v:220});
  if(vazio)anim();
}
function anim(){
  ctx.clearRect(0,0,cv.width,cv.height);
  pecas.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.v--;ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x/4)*4,Math.round(p.y/4)*4,p.s,p.s)});
  pecas=pecas.filter(p=>p.v>0&&p.y<cv.height+10);
  if(pecas.length)requestAnimationFrame(anim);else ctx.clearRect(0,0,cv.width,cv.height);
}
function coracoes(q=15){
  for(let i=0;i<q;i++)setTimeout(()=>{
    const c=document.createElement('div');c.className='cora';c.textContent=['💖','💕','💗','✨','🦖','🦕'][Math.floor(Math.random()*6)];
    c.style.left=Math.random()*100+'vw';c.style.top='100vh';c.style.animationDuration=(3+Math.random()*3)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),6500);
  },i*150);
}
